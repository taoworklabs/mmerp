name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# gen, lint, test and e2e run side by side; check is the one status the ruleset requires.
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@v7
      - &setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - &setup-pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - &setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            packages/ui/pnpm-lock.yaml
      - run: make gen
      - name: Generated code is committed
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

  lint:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup-go
      - *setup-pnpm
      - *setup-node
      - uses: actions/cache@v6
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ hashFiles('go.sum', 'Makefile') }}-${{ github.sha }}
          restore-keys: golangci-${{ hashFiles('go.sum', 'Makefile') }}-
      - run: make lint

  test:
    runs-on: ubuntu-latest
    services: &services
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mmerp
          POSTGRES_PASSWORD: mmerp
          POSTGRES_DB: mmerp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mmerp"
          --health-interval 2s
          --health-retries 30
    env: &db-env
      TEST_DATABASE_URL: postgres://mmerp:mmerp@localhost:5432/mmerp?sslmode=disable
    steps:
      - *checkout
      - *setup-go
      - *setup-pnpm
      - *setup-node
      - run: make test

  e2e:
    runs-on: ubuntu-latest
    services: *services
    env: *db-env
    steps:
      - *checkout
      - *setup-go
      - *setup-pnpm
      - *setup-node
      - run: make web/node_modules
      - id: playwright
        run: echo "version=$(pnpm -C web exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm -C web exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm -C web exec playwright install-deps chromium
      - run: make e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/

  check:
    needs: [gen, lint, test, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ join(needs.*.result, ',') }}" = "success,success,success,success"

  image:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - run: make image VERSION=${GITHUB_SHA::7}
      - run: make smoke
