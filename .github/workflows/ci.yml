name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mmerp
          POSTGRES_PASSWORD: mmerp
          POSTGRES_DB: mmerp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mmerp"
          --health-interval 2s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://mmerp:mmerp@localhost:5432/mmerp?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make gen
      - name: Generated code is committed
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
      - run: make lint
      - run: make test
      - run: pnpm -C web exec playwright install --with-deps chromium
      - run: make e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make image VERSION=${GITHUB_SHA::7}
      - run: make smoke
