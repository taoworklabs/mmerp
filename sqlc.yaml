# One entry per module; each module's generated store stays inside the module.
version: "2"
plugins:
  - name: data
    process: { cmd: ./bin/sqlc-gen-data, format: json }
sql:
  - &module
    engine: postgresql
    schema: migrations
    queries: internal/core/iam/queries
    gen:
      go: &go
        package: store
        out: internal/core/iam/internal/store
        sql_package: pgx/v5
        omit_unused_structs: true
    codegen: [{ plugin: data, out: internal/core/iam/internal/store }]
  - <<: *module
    queries: internal/core/setting/queries
    gen: { go: { <<: *go, out: internal/core/setting/internal/store } }
    codegen: [{ plugin: data, out: internal/core/setting/internal/store }]
  - <<: *module
    queries: internal/core/audit/queries
    gen: { go: { <<: *go, out: internal/core/audit/internal/store } }
    codegen: [{ plugin: data, out: internal/core/audit/internal/store }]
  - <<: *module
    queries: internal/modules/hrm/queries
    gen: { go: { <<: *go, out: internal/modules/hrm/internal/store } }
    codegen: [{ plugin: data, out: internal/modules/hrm/internal/store }]
  - <<: *module
